# Reusable build workflow (pattern from D:\repos\Workflows). Call from repo workflows:
# uses: Novolis-Platform/novolis-governance/.github/workflows/novolis-reusable-build.yml@main
name: Novolis reusable build
on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
      dotnet-version:
        required: false
        type: string
        default: '10.0.x'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet restore ${{ inputs.solution }}
      - run: dotnet build ${{ inputs.solution }} --no-restore -c Release
      - run: dotnet test ${{ inputs.solution }} --no-build -c Release
